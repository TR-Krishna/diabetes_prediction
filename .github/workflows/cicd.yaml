name: CI/CD Pipeline

on: 
  push: 
    branches: [main]
  workflow_dispatch:
    
env :
    IMAGE_NAME: krishnatr/diabetes_prediction
    RESOURCE_GROUP: diabetics-pred
    CONTAINER_APP_NAME: diabetes-prediction
# permissions:
#   contents: read
#   packages: write

jobs: 
  build-and-push: 
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v2
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: krishnatr/diabetes_prediction:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
        - name: Login to Azure
          uses: azure/login@v3
          with: 
            creds: ${{secrets.AZURE_CREDENTIALS}}
            
        - name: Deploy to Azure Container Apps
          uses: azure/container-apps-deploy-action@v1
          with: 
            resourceGroup: ${{env.RESOURCE_GROUP}}
            containerAppName: ${{env.CONTAINER_APP_NAME}}
            imageToDeploy: docker.io/${{env.IMAGE_NAME}}:${{github.sha}}
            registryUrl: docker.io
            registryUsername: ${{secrets.DOCKER_USERNAME}}
            registryPassword: ${{secrets.DOCKER_PASSWORD}}
  